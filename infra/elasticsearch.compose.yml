services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.26@sha256:d71769f4e1145dca3794a04ddcd67e12f1299048b3232025e55feda799904a5d
    container_name: scholarlens-es
    restart: unless-stopped
    ports:
      - "127.0.0.1:19200:9200"
    mem_limit: 800m
    memswap_limit: 800m
    cpus: 1.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      ES_JAVA_OPTS: -Xms256m -Xmx256m -XX:ActiveProcessorCount=1
    volumes:
      - scholarlens-es-data:/usr/share/elasticsearch/data
volumes:
  scholarlens-es-data:
    name: scholarlens-es-data
