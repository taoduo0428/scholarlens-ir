name: ScholarLens agent verification
on:
  push:
    branches: [zjl, codex/evo-full-product]
  pull_request:
    branches: [zjl]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      EVO_TEST_LOOPBACK_ES: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.18.0'
      - name: Frozen benchmark bytes
        run: |
          python -m tools.research_eval.v6_ci
          python -m tools.research_eval.v6_silver --public-only
      - name: Locked Python dependencies
        run: |
          python -m pip install -r backend/requirements-lock.txt -r backend/research/requirements.txt -r backend/research/pdf-layout-requirements.txt
          python -m pip check
      - name: Python checks
        run: |
          python -m ruff check backend tools/research_eval --select E9,F63,F7,F82
          python -m pytest -q backend/tests/test_health_probes.py backend/tests/research/test_budget_enforcement.py backend/tests/research/test_pdf_layout.py backend/tests/research/test_e11_intelligence.py backend/tests/research/test_project_memory.py backend/tests/research/test_descriptive_plan.py
          python -m pytest -q backend/tests/test_agent.py backend/tests/test_ai_responses.py backend/tests/test_agent_harness_reporting.py backend/tests/research/test_e10_profiles.py backend/tests/research/test_e10_operational.py backend/tests/research/test_e10_boundaries.py backend/tests/research/test_runtime_receipts.py backend/tests/research/test_workspace_recovery.py backend/tests/research/test_research_tools.py --junitxml=unit-results.xml
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm test
          npm run verify:structure
          npm run build
          npm audit --audit-level=moderate
      - name: Validate local service packaging
        run: |
          docker compose -f infra/product.compose.yml config -q
          docker build -f infra/ScholarLens.Dockerfile -t scholarlens-ci .
      - name: Python dependency advisories
        run: |
          python -m venv "$RUNNER_TEMP/auditor"
          "$RUNNER_TEMP/auditor/bin/pip" install -r tools/audit/requirements.txt
          sed '/^#/d;/^-c/d;/^$/d' backend/requirements-lock.txt backend/research/requirements.txt backend/research/constraints-tested.txt > "$RUNNER_TEMP/audit-locked.txt"
          "$RUNNER_TEMP/auditor/bin/pip-audit" --no-deps --disable-pip -r "$RUNNER_TEMP/audit-locked.txt"
      - name: Publish test counts
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, xml.etree.ElementTree as E
          p=pathlib.Path("unit-results.xml")
          if p.exists():
              s=E.parse(p).getroot().find("testsuite")
              pathlib.Path("unit-counts.json").write_text(json.dumps({k:s.get(k) for k in ("tests","failures","errors","skipped","time")}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: agent-unit-counts
          path: unit-counts.json
          if-no-files-found: ignore
