name: ScholarLens agent verification
on:
  push:
    branches: [main, zjl, codex/evo-full-product]
  pull_request:
    branches: [main, zjl]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      EVO_TEST_LOOPBACK_ES: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.18.0'
      - name: Frozen benchmark bytes
        run: |
          python -m tools.research_eval.v6_ci
          python -m tools.research_eval.v6_silver --public-only
      - name: Locked Python dependencies
        run: |
          python -m pip install -r backend/requirements-lock.txt -r backend/research/requirements.txt -r backend/research/pdf-layout-requirements.txt
          python -m pip check
      - name: Python checks
        run: |
          python -m ruff check backend tools/research_eval --select E9,F63,F7,F82
          python -m pytest -q --junitxml=unit-results.xml \
            backend/tests/research/test_subject_facts.py backend/tests/research/test_shared_capacity.py backend/tests/research/test_submission_trace.py \
            backend/tests/research/test_otlp_delivery.py backend/tests/test_health_probes.py backend/tests/research/test_budget_enforcement.py \
            backend/tests/research/test_pdf_layout.py backend/tests/research/test_table_continuation.py backend/tests/research/test_e11_intelligence.py \
            backend/tests/research/test_project_memory.py backend/tests/research/test_descriptive_plan.py backend/tests/test_agent.py \
            backend/tests/test_ai_responses.py backend/tests/test_agent_harness_reporting.py backend/tests/research/test_e10_profiles.py \
            backend/tests/research/test_e10_operational.py backend/tests/research/test_e10_boundaries.py backend/tests/research/test_runtime_receipts.py \
            backend/tests/research/test_workspace_recovery.py backend/tests/research/test_research_tools.py backend/tests/research/test_e11_model_relations.py \
            backend/tests/research/test_figure_legend.py backend/tests/research/test_chart_readings.py \
            backend/tests/research/test_multihop_scope.py backend/tests/research/test_task_lifecycle.py backend/tests/research/test_formula_links.py \
            backend/tests/research/test_program_release.py backend/tests/research/test_governance_view.py \
            backend/tests/research/test_quantitative_evidence.py backend/tests/research/test_account_erasure.py backend/tests/research/test_offline_verifier.py \
            backend/tests/test_trusted_model_proxy.py backend/tests/research/test_live_research_acceptance.py
      - name: SQLite migration and rollback
        run: python -m pytest -q backend/tests/test_v21_flows.py -k 'migration_legacy or restore_preserves'
      - name: Research scorecard
        run: |
          python -m pytest -q backend/tests/research/test_eval_p1.py -k pra_scorecard
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm test
          node --check tests/real-workbench-live.mjs
          npm run verify:structure
          npm run build:production
          npm audit --audit-level=moderate
      - name: Python dependency advisories
        run: |
          python -m venv "$RUNNER_TEMP/auditor"
          "$RUNNER_TEMP/auditor/bin/pip" install -r tools/audit/requirements.txt
          sed '/^#/d;/^-c/d;/^$/d' backend/requirements-lock.txt backend/research/requirements.txt backend/research/constraints-tested.txt backend/research/pdf-layout-requirements.txt | sort -u > "$RUNNER_TEMP/audit-locked.txt"
          "$RUNNER_TEMP/auditor/bin/pip-audit" --no-deps --disable-pip -r "$RUNNER_TEMP/audit-locked.txt"
      - name: Publish test counts
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, xml.etree.ElementTree as E
          p=pathlib.Path("unit-results.xml")
          if p.exists():
              s=E.parse(p).getroot().find("testsuite")
              pathlib.Path("unit-counts.json").write_text(json.dumps({k:s.get(k) for k in ("tests","failures","errors","skipped","time")}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: agent-unit-counts
          path: unit-counts.json
          if-no-files-found: ignore
  image:
    name: Build and scan (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [standard, pdf-ocr]
    env:
      IMAGE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate local service packaging
        run: |
          docker compose -f infra/product.compose.yml config -q
          docker compose -f infra/product.compose.yml -f infra/pdf-ocr.compose.yml config -q
          SCHOLARLENS_APPROVALS_DIR="$RUNNER_TEMP" SCHOLARLENS_LAB_SNAPSHOT_DIR="$RUNNER_TEMP" \
            docker compose -f infra/product.compose.yml -f infra/governance.compose.yml config -q
          docker build --target "$IMAGE_TARGET" -f infra/ScholarLens.Dockerfile -t scholarlens-ci .
          docker run --rm --network none --read-only --tmpfs /tmp scholarlens-ci python -c "import os, ssl, sqlite3, gzip; assert os.getuid() == 10001; ssl.create_default_context(); assert sqlite3.connect(':memory:').execute('select 6*7').fetchone() == (42,); assert gzip.decompress(gzip.compress(b'paper')) == b'paper'"
          docker run --rm --network none --read-only --tmpfs /tmp scholarlens-ci python -c "from importlib.util import find_spec; assert find_spec('pytest') is None and find_spec('ruff') is None"
          docker run --rm --network none --read-only --tmpfs /tmp scholarlens-ci python -c "from backend.research.chart_registry import BUILTIN, read_registry; assert read_registry(BUILTIN).profiles"
          docker run --rm --network none --read-only --tmpfs /tmp --tmpfs /var/lib/scholarlens:uid=10001,gid=10001 \
            -e SCHOLARLENS_RESEARCH_ENABLED=true -e SCHOLARLENS_EVOLUTION_LAB=true scholarlens-ci \
            python -c "from backend.app1 import app; paths=app.openapi()['paths']; assert '/api/research/tasks' in paths and '/api/evolution-lab/governance' in paths"
          if [ "$IMAGE_TARGET" = "pdf-ocr" ]; then
            docker run --rm --network none --read-only --tmpfs /tmp scholarlens-ci python -m backend.research.ocr_check
          fi
      - name: Isolated Compose startup and volume retention
        if: matrix.target == 'standard'
        shell: bash
        run: |
          set -euo pipefail
          export SCHOLARLENS_IMAGE=scholarlens-ci:latest SCHOLARLENS_INDEX=scholarlens-fixture
          export SCHOLARLENS_E11_ENABLED=true SCHOLARLENS_PORT=18001
          compose=(docker compose --project-name "sl-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -f infra/product.compose.yml)
          trap 'status=$?; trap - EXIT; if ((status)); then "${compose[@]}" ps; fi; "${compose[@]}" down -v --remove-orphans || exit 1; exit "$status"' EXIT
          "${compose[@]}" up -d --no-build --wait --wait-timeout 200
          "${compose[@]}" exec -T search curl -fsS -X PUT -H 'Content-Type: application/json' -d '{"mappings":{"_meta":{"data_status":"mock","input_records":0}}}' http://localhost:9200/scholarlens-fixture
          origin=http://127.0.0.1:18001
          curl -fsS "$origin/readyz" | jq -e '.status == "ready"'
          curl -fsS "$origin/" | grep -i 'scholarlens'
          curl -fsS "$origin/openapi.json" | jq -e '.paths["/api/research/tasks"] != null'
          credentials=$(python -c 'import json, secrets; print(json.dumps({"username": "compose-check", "password": secrets.token_hex(24)}))')
          curl -fsS -H 'Content-Type: application/json' --data "$credentials" "$origin/api/auth/register" | jq -e '.username == "compose-check"'
          "${compose[@]}" up -d --force-recreate --no-deps --no-build --wait --wait-timeout 90 api
          curl -fsS -H 'Content-Type: application/json' --data "$credentials" "$origin/api/auth/login" -o /dev/null
          curl -fsS "$origin/readyz" | jq -e '.status == "ready"'
      - name: Scan the built application image
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 --output grype.tgz https://github.com/anchore/grype/releases/download/v0.122.1/grype_0.122.1_linux_amd64.tar.gz
          echo 'f1ba7e2917ee1395618de20a98da0aa7c0fb1788927797651047c50502a37538  grype.tgz' | sha256sum --check
          tar -xzf grype.tgz grype
          docker image save --output application.tar scholarlens-ci:latest
          config_path=$(tar -xOf application.tar manifest.json | jq -er '[.[] | select(any(.RepoTags[]?; . == "scholarlens-ci:latest" or endswith("/scholarlens-ci:latest"))) | .Config] | if length == 1 then first else error("ambiguous application image") end')
          config_hash=$(tar -xOf application.tar "$config_path" | sha256sum | cut -d ' ' -f1)
          printf 'sha256:%s\n' "$config_hash" > "$GITHUB_WORKSPACE/scanned-image-id.txt"
          ./grype docker-archive:application.tar -o json > "$GITHUB_WORKSPACE/image-findings.json"
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          import collections, json, pathlib
          scan = json.loads(pathlib.Path("image-findings.json").read_bytes())
          expected = pathlib.Path("scanned-image-id.txt").read_text().strip()
          actual = scan["source"]["target"]["imageID"]
          if actual != expected:
              raise SystemExit(f"Scanned config {actual} differs from exported config {expected}")
          counts = collections.Counter(m["vulnerability"]["severity"] for m in scan["matches"])
          print(expected, dict(counts))
          if counts["Critical"]:
              raise SystemExit("Critical image findings require remediation")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && hashFiles('image-findings.json') != '' }}
        with:
          name: application-image-findings-${{ matrix.target }}
          path: |
            image-findings.json
            scanned-image-id.txt

      - name: Scan the Compose Elasticsearch image
        if: matrix.target == 'standard'
        run: |
          set -euo pipefail
          image=$(docker compose -f infra/product.compose.yml config --format json | jq -er '.services.search.image')
          archive="$RUNNER_TEMP/search.tar"
          docker image save --output "$archive" "$image"
          config=$(tar -xOf "$archive" manifest.json | jq -er 'if length == 1 then .[0].Config else error("ambiguous search image") end')
          config_hash=$(tar -xOf "$archive" "$config" | sha256sum | cut -d ' ' -f1)
          printf 'sha256:%s\n' "$config_hash" > es-image-id.txt
          "$RUNNER_TEMP/grype" "docker-archive:$RUNNER_TEMP/search.tar" -o json > es-image-findings.json
          python - <<'PY'
          import collections, json, pathlib
          scan = json.loads(pathlib.Path("es-image-findings.json").read_bytes())
          assert scan["source"]["target"]["imageID"] == pathlib.Path("es-image-id.txt").read_text().strip()
          counts = collections.Counter(m["vulnerability"]["severity"] for m in scan["matches"])
          print(dict(counts))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && hashFiles('es-image-findings.json') != '' }}
        with:
          name: compose-elasticsearch-image-findings
          path: |
            es-image-findings.json
            es-image-id.txt
